name: Daily Data Analytics jobs report

# GitHub cron is UTC and may start late (or occasionally skip a trigger), so there are several triggers.
# Every run is idempotent: once today's report was sent (data/state.json -> last_sent_date) later runs exit.
# The script itself waits so the e-mail is NEVER sent before 10:00 Asia/Jerusalem (summer & winter time).
#   UTC     Israel summer (UTC+3)  Israel winter (UTC+2)
#   04:07   07:07                  06:07    <- main run: scan, build xlsx, wait for 10:00, send
#   04:47   07:47                  06:47    <- backup
#   06:17   09:17                  08:17    <- backup
#   07:07   10:07                  09:07    <- backup (sends right away if 10:00 has passed)
#   07:37   10:37                  09:37    <- backup
#   08:27   11:27                  10:27    <- last backup
on:
  schedule:
    - cron: "7 4 * * *"
    - cron: "47 4 * * *"
    - cron: "17 6 * * *"
    - cron: "7 7 * * *"
    - cron: "37 7 * * *"
    - cron: "27 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = normal run (sends at 10:00) | report-only = build xlsx, no e-mail | test-email = send a marked test e-mail now"
        type: choice
        options: [daily, report-only, test-email]
        default: report-only

permissions:
  contents: write

concurrency:
  group: daily-jobs-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # an explicit branch = its latest commit, not the trigger-time snapshot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan, build report, e-mail at 10:00
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: |
          case "$MODE" in
            report-only) python -m agent.main run --no-send ;;
            test-email)  python -m agent.main run --test-email --max-minutes 40 ;;
            *)           python -m agent.main run ;;
          esac

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-report-${{ github.run_id }}
          path: reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

      - name: Save state to the repository
        if: always()
        run: |
          git config user.name  "jobs-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily report $(TZ=Asia/Jerusalem date +%F) [skip ci]"
          for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done
